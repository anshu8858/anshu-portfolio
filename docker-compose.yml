services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: anshu-portfolio:latest
    container_name: anshu-portfolio
    restart: unless-stopped
    ports:
      - "6666:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

